<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixkosten</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fixkosten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #efeeea;
  --line: #e3e2dd;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #8a8984;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --done: #1baf7a;
  --danger: #d03b3a;
  --track: #e8e7e2;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --surface-2: #252523;
    --line: #2e2e2c;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #8d8c84;
    --accent: #3987e5;
    --done: #199e70;
    --danger: #e66767;
    --track: #2e2e2c;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #252523; --line: #2e2e2c;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84; --accent: #3987e5;
  --done: #199e70; --danger: #e66767; --track: #2e2e2c;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c;
  --shadow: none;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding: env(safe-area-inset-top) 0 calc(160px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
header { padding: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
header h1 { font-size: 22px; font-weight: 700; margin: 0; flex: 1; letter-spacing: -.01em; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 0;
  background: var(--surface-2); display: grid; place-items: center;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:disabled { opacity: .35; }
.today-btn { border: 0; background: none; color: var(--accent); font-size: 14px; font-weight: 600; padding: 0 4px; }

/* Segmented control */
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 2px; margin: 4px 0 14px; }
.seg button {
  flex: 1; border: 0; background: none; padding: 7px 8px; border-radius: 8px;
  font-size: 14px; font-weight: 600; color: var(--text-2);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Cards */
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.summary { display: flex; align-items: center; gap: 16px; }
.summary .donut { flex: 0 0 auto; }
.summary .figs { flex: 1; min-width: 0; }
.label { font-size: 13px; color: var(--text-2); font-weight: 500; }
.hero { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 10px; }
.kv { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; color: var(--text-2); }
.kv b { color: var(--text); font-weight: 600; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Lists */
.section-title { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin: 18px 4px 8px; }
.list { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%;
  border: 0; background: none; text-align: left; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-weight: 600; text-align: right; white-space: nowrap; }
.row .amt small { display: block; font-size: 12px; font-weight: 500; color: var(--text-3); }
.check {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--text-3); display: grid; place-items: center; transition: all .15s;
}
.check svg { width: 14px; height: 14px; opacity: 0; color: #fff; }
.row.done .check { background: var(--done); border-color: var(--done); }
.row.done .check svg { opacity: 1; }
.row.done .name { text-decoration: line-through; color: var(--text-3); }
.row.done .amt { color: var(--text-3); }
.cat-bar { flex: 0 0 auto; width: 4px; align-self: stretch; border-radius: 2px; }
.chev { color: var(--text-3); flex: 0 0 auto; }

.empty { text-align: center; color: var(--text-2); padding: 32px 16px; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

/* Legend */
.legend { margin-top: 14px; }
.legend .kv { padding: 5px 0; }
.legend .kv span:first-child { color: var(--text); }

/* Buttons */
.btn {
  border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600;
  background: var(--surface-2); width: 100%;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: none; color: var(--danger); }
.btn-row { display: flex; gap: 10px; margin-top: 10px; }
.fab {
  position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(88px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: 50%; border: 0;
  background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25);
  display: grid; place-items: center;
}
.fab svg { width: 26px; height: 26px; }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  display: flex; justify-content: center;
}
nav.tabs button {
  flex: 0 1 140px; border: 0; background: none; color: var(--text-3);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; padding: 4px;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); }

/* Dialog */
dialog {
  border: 0; padding: 0; width: min(560px, 100%); max-width: 100%; margin: auto auto 0;
  background: var(--surface); color: var(--text);
  border-radius: 20px 20px 0 0;
  padding-bottom: env(safe-area-inset-bottom);
}
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog form { padding: 18px 16px 16px; }
dialog h2 { margin: 0 0 14px; font-size: 18px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: var(--text-2); font-weight: 500; margin-bottom: 4px; }
.field input, .field select {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); font-size: 16px; -webkit-appearance: none; appearance: none;
}
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; min-width: 0; }
.hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }

.tooltip {
  position: fixed; pointer-events: none; background: var(--text); color: var(--bg);
  padding: 6px 9px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .1s; z-index: 10;
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<button class="fab" id="fab" aria-label="Posten hinzufügen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="month" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 12"/></svg>
    Monat
  </button>
  <button role="tab" data-tab="items" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    Posten
  </button>
</nav>

<dialog id="dlg">
  <form method="dialog" id="itemForm">
    <h2 id="dlgTitle">Neuer Posten</h2>
    <div class="field">
      <label for="fName">Name</label>
      <input id="fName" required autocomplete="off" placeholder="z. B. Miete">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="fAmount">Betrag (€)</label>
        <input id="fAmount" required inputmode="decimal" autocomplete="off" placeholder="0,00">
      </div>
      <div class="field">
        <label for="fFreq">Frequenz</label>
        <select id="fFreq">
          <option value="1">monatlich</option>
          <option value="3">vierteljährlich</option>
          <option value="6">halbjährlich</option>
          <option value="12">jährlich</option>
        </select>
      </div>
    </div>
    <div class="field" id="startField">
      <label for="fStart">Fällig im Monat</label>
      <select id="fStart"></select>
      <div class="hint" id="startHint"></div>
    </div>
    <div class="field">
      <label for="fCat">Kategorie</label>
      <select id="fCat"></select>
    </div>
    <div class="btn-row">
      <button type="button" class="btn" id="btnCancel">Abbrechen</button>
      <button type="submit" class="btn primary" id="btnSave">Speichern</button>
    </div>
    <button type="button" class="btn danger" id="btnDelete" style="margin-top:6px">Posten löschen</button>
  </form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="tooltip" id="tip"></div>

<script>
(() => {
  // ---------- Data ----------
  const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const FREQ = { 1: 'monatlich', 3: 'vierteljährlich', 6: 'halbjährlich', 12: 'jährlich' };
  // Fixed order = fixed colour slot (colour follows the category, never its rank)
  const CATS = [
    { id: 'wohnen',  name: 'Wohnen & Energie',  color: 'var(--c1)' },
    { id: 'vers',    name: 'Versicherungen',    color: 'var(--c2)' },
    { id: 'abos',    name: 'Abos & Medien',     color: 'var(--c3)' },
    { id: 'mobil',   name: 'Mobilität',         color: 'var(--c4)' },
    { id: 'sparen',  name: 'Sparen & Kredite',  color: 'var(--c5)' },
    { id: 'sonst',   name: 'Sonstiges',         color: 'var(--c6)' },
  ];
  const catOf = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];

  const store = {
    get(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let items  = store.get('fk.items', []);
  let checks = store.get('fk.checks', {});   // { "2026-11": [itemId, ...] }
  const ui   = store.get('fk.ui', { mode: 'due' });

  const now = new Date();
  const state = { tab: 'month', y: now.getFullYear(), m: now.getMonth() + 1, mode: ui.mode || 'due' };

  const save = () => { store.set('fk.items', items); store.set('fk.checks', checks); };
  const ymKey = (y, m) => `${y}-${String(m).padStart(2, '0')}`;
  const isDue = (it, m) => it.freq == 1 || ((m - it.start) % it.freq + it.freq) % it.freq === 0;
  const monthly = it => it.amount / it.freq;
  const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
  const fmt = v => eur.format(Math.round(v * 100) / 100);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const dueMonths = it => {
    if (it.freq == 1) return 'jeden Monat';
    const ms = []; for (let i = 0; i < 12 / it.freq; i++) ms.push(MONTHS[(it.start - 1 + i * it.freq) % 12].slice(0, 3));
    return ms.join(', ');
  };

  // ---------- Donut chart ----------
  // segments: [{value, color, label}] ; drawn as stroked arcs with a 2px surface gap
  function donut(segments, size, centerHTML) {
    const total = segments.reduce((s, x) => s + x.value, 0);
    const r = 42, sw = 14, C = 2 * Math.PI * r;
    const gapPx = segments.filter(s => s.value > 0).length > 1 ? 2.5 : 0;
    let offset = 0, arcs = '';
    if (total > 0) {
      segments.forEach((s, i) => {
        if (s.value <= 0) return;
        const len = s.value / total * C;
        const dash = Math.max(len - gapPx, 0.5);
        arcs += `<circle class="seg-arc" data-i="${i}" cx="50" cy="50" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}"
          stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 50 50)"></circle>`;
        offset += len;
      });
    }
    return `<div class="donut" style="position:relative;width:${size}px;height:${size}px">
      <svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${esc(segments.map(s => s.label + ': ' + fmt(s.value)).join(', '))}">
        <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"></circle>${arcs}
      </svg>
      <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none">${centerHTML || ''}</div>
    </div>`;
  }

  // ---------- Views ----------
  const $app = document.getElementById('app');

  function headerHTML(title, withNav) {
    const isCurrent = state.y === now.getFullYear() && state.m === now.getMonth() + 1;
    return `<header>
      <h1>${title}</h1>
      ${withNav ? `
        ${isCurrent ? '' : '<button class="today-btn" id="btnToday">Heute</button>'}
        <button class="icon-btn" id="prev" aria-label="Vorheriger Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="icon-btn" id="next" aria-label="Nächster Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>` : ''}
    </header>`;
  }

  const checkSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function renderMonth() {
    const key = ymKey(state.y, state.m);
    const done = new Set(checks[key] || []);
    const seg = `<div class="seg" role="group" aria-label="Ansicht">
      <button data-mode="due" aria-pressed="${state.mode === 'due'}">Fällig diesen Monat</button>
      <button data-mode="avg" aria-pressed="${state.mode === 'avg'}">Ø pro Monat</button>
    </div>`;

    if (!items.length) {
      $app.innerHTML = headerHTML(`${MONTHS[state.m - 1]} ${state.y}`, true) + seg +
        `<div class="card empty"><b>Noch keine Posten</b>Tippe auf <b style="display:inline">+</b>, um deine erste Fixkosten-Position anzulegen.</div>`;
      return;
    }

    if (state.mode === 'due') {
      const due = items.filter(it => isDue(it, state.m)).sort((a, b) => (done.has(a.id) - done.has(b.id)) || b.amount - a.amount);
      const total = due.reduce((s, it) => s + it.amount, 0);
      const paid  = due.filter(it => done.has(it.id)).reduce((s, it) => s + it.amount, 0);
      const open  = total - paid;
      const openN = due.filter(it => !done.has(it.id)).length;
      const pct = total ? Math.round(paid / total * 100) : 0;

      $app.innerHTML = headerHTML(`${MONTHS[state.m - 1]} ${state.y}`, true) + seg + `
        <div class="card summary">
          ${donut([{ value: paid, color: 'var(--done)', label: 'Abgebucht' }, { value: open, color: 'transparent', label: 'Offen' }], 108,
            `<div><div class="num" style="font-size:20px;font-weight:700">${pct}%</div><div style="font-size:11px;color:var(--text-3)">erledigt</div></div>`)}
          <div class="figs">
            <div class="label">Noch offen</div>
            <div class="hero num">${fmt(open)}</div>
            <div class="kv"><span><span class="dot" style="background:var(--done)"></span>Abgebucht</span><b class="num">${fmt(paid)}</b></div>
            <div class="kv"><span><span class="dot" style="background:var(--track)"></span>Gesamt fällig</span><b class="num">${fmt(total)}</b></div>
          </div>
        </div>
        <div class="section-title">${due.length ? `${openN} von ${due.length} offen` : 'Nichts fällig'}</div>
        ${due.length ? `<div class="list">${due.map(it => {
          const c = catOf(it.cat), d = done.has(it.id);
          return `<button class="row ${d ? 'done' : ''}" data-toggle="${it.id}" aria-pressed="${d}">
            <span class="check">${checkSVG}</span>
            <span class="main"><div class="name">${esc(it.name)}</div><div class="sub"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}${it.freq != 1 ? ' · ' + FREQ[it.freq] : ''}</div></span>
            <span class="amt num">${fmt(it.amount)}</span>
          </button>`;
        }).join('')}</div>` : '<div class="card empty">In diesem Monat ist kein Posten fällig.</div>'}
        ${nextMonthsHTML()}`;
    } else {
      const total = items.reduce((s, it) => s + monthly(it), 0);
      const byCat = CATS.map(c => ({ ...c, value: items.filter(it => catOf(it.cat).id === c.id).reduce((s, it) => s + monthly(it), 0) }))
                        .filter(c => c.value > 0);
      const sorted = [...items].sort((a, b) => monthly(b) - monthly(a));
      $app.innerHTML = headerHTML('Durchschnitt', false) + seg + `
        <div class="card">
          <div style="display:flex;justify-content:center">
            ${donut(byCat.map(c => ({ value: c.value, color: c.color, label: c.name })), 190,
              `<div><div style="font-size:12px;color:var(--text-2)">Ø pro Monat</div><div class="num" style="font-size:22px;font-weight:700">${fmt(total)}</div><div class="num" style="font-size:12px;color:var(--text-3)">${fmt(total * 12)} / Jahr</div></div>`)}
          </div>
          <div class="legend">${byCat.map(c => `
            <div class="kv"><span><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</span>
            <span class="num"><b>${fmt(c.value)}</b> <span style="color:var(--text-3);display:inline-block;min-width:3.2em;text-align:right">${Math.round(c.value / total * 100)}%</span></span></div>`).join('')}
          </div>
        </div>
        <div class="section-title">Was du monatlich einplanen solltest</div>
        <div class="list">${sorted.map(it => {
          const c = catOf(it.cat);
          return `<div class="row">
            <span class="cat-bar" style="background:${c.color}"></span>
            <span class="main"><div class="name">${esc(it.name)}</div><div class="sub">${fmt(it.amount)} ${FREQ[it.freq]}</div></span>
            <span class="amt num">${fmt(monthly(it))}<small>pro Monat</small></span>
          </div>`;
        }).join('')}</div>`;
      bindDonutHover(byCat.map(c => ({ label: c.name, value: c.value, pct: c.value / total })));
    }
  }

  // Small preview: what non-monthly items are coming in the next 3 months
  function nextMonthsHTML() {
    const rows = [];
    for (let i = 1; i <= 3; i++) {
      const m = (state.m - 1 + i) % 12 + 1;
      const extra = items.filter(it => it.freq != 1 && isDue(it, m));
      if (extra.length) rows.push({ m, sum: extra.reduce((s, it) => s + it.amount, 0), names: extra.map(it => it.name) });
    }
    if (!rows.length) return '';
    return `<div class="section-title">Demnächst (außer Monatliches)</div>
      <div class="list">${rows.map(r => `<div class="row">
        <span class="main"><div class="name">${MONTHS[r.m - 1]}</div><div class="sub">${esc(r.names.join(', '))}</div></span>
        <span class="amt num">+ ${fmt(r.sum)}</span></div>`).join('')}</div>`;
  }

  function renderItems() {
    const sorted = [...items].sort((a, b) => CATS.indexOf(catOf(a.cat)) - CATS.indexOf(catOf(b.cat)) || a.name.localeCompare(b.name, 'de'));
    const total = items.reduce((s, it) => s + monthly(it), 0);
    $app.innerHTML = headerHTML('Posten', false) + (items.length ? `
      <div class="section-title">${items.length} Posten · Ø ${fmt(total)} / Monat</div>
      <div class="list">${sorted.map(it => {
        const c = catOf(it.cat);
        return `<button class="row" data-edit="${it.id}">
          <span class="cat-bar" style="background:${c.color}"></span>
          <span class="main"><div class="name">${esc(it.name)}</div><div class="sub">${FREQ[it.freq]}${it.freq != 1 ? ' · ' + dueMonths(it) : ''}</div></span>
          <span class="amt num">${fmt(it.amount)}</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>`;
      }).join('')}</div>` : `<div class="card empty"><b>Noch keine Posten</b>Tippe auf <b style="display:inline">+</b>, um loszulegen.</div>`) + `
      <div class="section-title">Sicherung</div>
      <div class="card">
        <div style="font-size:14px;color:var(--text-2);margin-bottom:10px">Deine Daten liegen nur auf diesem Gerät. Exportiere ab und zu eine Sicherung (z. B. in die Dateien-App / iCloud).</div>
        <div class="btn-row" style="margin-top:0">
          <button class="btn" id="btnExport">Exportieren</button>
          <button class="btn" id="btnImport">Importieren</button>
        </div>
      </div>`;
  }

  function render() {
    document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === state.tab));
    state.tab === 'month' ? renderMonth() : renderItems();
  }

  // ---------- Hover / tap tooltip for chart segments ----------
  const $tip = document.getElementById('tip');
  function bindDonutHover(data) {
    document.querySelectorAll('.seg-arc').forEach(el => {
      el.style.cursor = 'pointer';
      const d = data[+el.dataset.i];
      const show = e => {
        const p = e.touches ? e.touches[0] : e;
        $tip.textContent = `${d.label}: ${fmt(d.value)} (${Math.round(d.pct * 100)}%)`;
        $tip.style.left = Math.min(p.clientX + 12, innerWidth - $tip.offsetWidth - 8) + 'px';
        $tip.style.top = (p.clientY - 40) + 'px';
        $tip.style.opacity = 1;
      };
      el.addEventListener('pointermove', show);
      el.addEventListener('pointerdown', show);
      el.addEventListener('pointerleave', () => $tip.style.opacity = 0);
    });
  }
  document.addEventListener('scroll', () => $tip.style.opacity = 0, { passive: true });

  // ---------- Events ----------
  $app.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.id === 'prev' || t.id === 'next') {
      state.m += t.id === 'next' ? 1 : -1;
      if (state.m > 12) { state.m = 1; state.y++; } if (state.m < 1) { state.m = 12; state.y--; }
      return render();
    }
    if (t.id === 'btnToday') { state.y = now.getFullYear(); state.m = now.getMonth() + 1; return render(); }
    if (t.dataset.mode) { state.mode = t.dataset.mode; store.set('fk.ui', { mode: state.mode }); return render(); }
    if (t.dataset.toggle) {
      const key = ymKey(state.y, state.m), set = new Set(checks[key] || []), id = t.dataset.toggle;
      set.has(id) ? set.delete(id) : set.add(id);
      checks[key] = [...set]; save();
      if (navigator.vibrate) navigator.vibrate(10);
      return render();
    }
    if (t.dataset.edit) return openDialog(items.find(it => it.id === t.dataset.edit));
    if (t.id === 'btnExport') return exportData();
    if (t.id === 'btnImport') return document.getElementById('importFile').click();
  });

  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => { state.tab = b.dataset.tab; render(); scrollTo(0, 0); }));
  document.getElementById('fab').addEventListener('click', () => openDialog(null));

  // ---------- Dialog ----------
  const $dlg = document.getElementById('dlg');
  const f = { name: fName, amount: fAmount, freq: fFreq, start: fStart, cat: fCat };
  f.start.innerHTML = MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
  f.cat.innerHTML = CATS.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  let editing = null;

  function updateStartField() {
    const freq = +f.freq.value;
    startField.hidden = freq === 1;
    if (freq !== 1) {
      const fake = { freq, start: +f.start.value };
      startHint.textContent = 'Wird abgebucht: ' + dueMonths(fake);
      startField.querySelector('label').textContent = freq === 12 ? 'Fällig im Monat' : 'Erstmals fällig im Monat';
    }
  }
  f.freq.addEventListener('change', updateStartField);
  f.start.addEventListener('change', updateStartField);

  function openDialog(it) {
    editing = it;
    dlgTitle.textContent = it ? 'Posten bearbeiten' : 'Neuer Posten';
    f.name.value = it ? it.name : '';
    f.amount.value = it ? String(it.amount).replace('.', ',') : '';
    f.freq.value = it ? it.freq : 1;
    f.start.value = it ? it.start : state.m;
    f.cat.value = it ? it.cat : 'wohnen';
    btnDelete.hidden = !it;
    updateStartField();
    $dlg.showModal();
    if (!it) setTimeout(() => f.name.focus(), 50);
  }
  btnCancel.addEventListener('click', () => $dlg.close());
  $dlg.addEventListener('click', e => { if (e.target === $dlg) $dlg.close(); });

  itemForm.addEventListener('submit', e => {
    e.preventDefault();
    const amount = parseFloat(f.amount.value.replace(/\s|€/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
    if (!f.name.value.trim()) return f.name.focus();
    if (!isFinite(amount) || amount <= 0) { f.amount.focus(); f.amount.select(); return; }
    const data = { name: f.name.value.trim(), amount: Math.round(amount * 100) / 100, freq: +f.freq.value, start: +f.start.value, cat: f.cat.value };
    if (data.freq === 1) data.start = 1;
    if (editing) Object.assign(editing, data); else items.push({ id: uid(), ...data });
    save(); $dlg.close(); render();
  });

  btnDelete.addEventListener('click', () => {
    if (!editing || !confirm(`„${editing.name}“ wirklich löschen?`)) return;
    items = items.filter(it => it !== editing);
    for (const k in checks) checks[k] = checks[k].filter(id => id !== editing.id);
    save(); $dlg.close(); render();
  });

  // ---------- Backup ----------
  async function exportData() {
    const json = JSON.stringify({ app: 'fixkosten', version: 1, exported: new Date().toISOString(), items, checks }, null, 2);
    const name = `fixkosten-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Fixkosten-Sicherung' }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  importFile.addEventListener('change', async () => {
    const file = importFile.files[0]; importFile.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.items)) throw new Error();
      if (!confirm(`${data.items.length} Posten importieren? Deine aktuellen Daten werden ersetzt.`)) return;
      items = data.items; checks = data.checks || {}; save(); render();
    } catch { alert('Die Datei ist keine gültige Fixkosten-Sicherung.'); }
  });

  // Refresh when the app comes back to the foreground (e.g. new month started)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const d = new Date();
    if (d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) location.reload();
  });

  render();

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
